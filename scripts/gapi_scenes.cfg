// Fixed test scenes for capture_vkquake3.sh. Each scene is a screenshot
// named scene_<number>_<name>. The scenes show the renderer features that
// "demo four" does not show: the main menu, a mirror, a portal, stencil and
// projected shadows, the debug line draws, and fog.
//
// The capture runs with "fixedtime 16", so each frame advances the game time
// by 16 ms and the "wait" counts give the same images in each run.
// Set a cvar some frames before the screenshot that needs it.

set cg_drawGun 0
set con_notifytime 0
set cg_thirdPersonRange 120
set cg_thirdPersonAngle 90

wait 30
screenshot scene_00_menu

// q3dm0 has a mirror (y = -1341) and a portal (y = -1877). Both face +y.
devmap q3dm0
wait 300
setviewpos -1154 -1180 30 270
wait 30
screenshot scene_01_mirror
setviewpos -1152 -1700 30 270
wait 30
screenshot scene_02_portal

set cg_thirdPerson 1
set cg_shadows 2
setviewpos 868 -820 24 135
wait 60
screenshot scene_03_shadow_stencil
set cg_shadows 3
wait 30
screenshot scene_04_shadow_projected

set cg_thirdPerson 0
set cg_shadows 1
setviewpos 346 -394 40 135
set r_showtris 1
wait 30
screenshot scene_05_showtris
set r_showtris 0
set r_shownormals 1
wait 30
screenshot scene_06_shownormals
set r_shownormals 0

// q3dm4 has a dense fog volume from (-640, -1024, -384) to (256, -512, -256).
devmap q3dm4
wait 300
setviewpos -200 -450 -300 270
wait 30
screenshot scene_07_fog

// The last screenshot is written in a later frame, so wait before quit.
wait 30
quit
