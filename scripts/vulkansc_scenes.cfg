// Fixed test scenes for vulkansc_tests.sh: the scenes of gapi_scenes.cfg that
// use the default cvars, because the Vulkan SC pipeline cache has the
// pipelines of the default cvars only (scripts/vulkansc_pipelines.sh). The
// scenes show the main menu, a mirror, a portal, and fog. The mirror draws
// with the reversed front face, and the portal draws with the clip plane.
//
// The test runs with "fixedtime 16", so each frame advances the game time by
// 16 ms and the "wait" counts give the same images in each run.

set cg_drawGun 0
set con_notifytime 0

wait 30
screenshot scene_00_menu

// q3dm0 has a mirror (y = -1341) and a portal (y = -1877). Both face +y.
devmap q3dm0
wait 300
setviewpos -1154 -1180 30 270
wait 30
screenshot scene_01_mirror
setviewpos -1152 -1700 30 270
wait 30
screenshot scene_02_portal

// q3dm4 has a dense fog volume (gapi_scenes.cfg has the details).
devmap q3dm4
wait 300
setviewpos -200 -450 -270 270
wait 30
screenshot scene_07_fog

// The last screenshot is written in a later frame, so wait before quit.
wait 30
quit
